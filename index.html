<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Review</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9 14 2 2 4-4"/></svg>
      </span>
      <h1>Contract Review</h1>
    </div>
    <div id="header-file" class="header-file" hidden>
      <span class="dot" aria-hidden="true"></span>
      <span id="header-file-name"></span>
    </div>
  </header>

  <main class="layout">
    <!-- Left: contract -->
    <section class="panel" aria-labelledby="contract-title">
      <div class="panel-header">
        <div>
          <h2 id="contract-title">Contract</h2>
          <p id="contract-sub" class="sub">No document uploaded</p>
        </div>
        <div class="actions">
          <button id="replace-btn" class="btn-secondary" type="button" hidden>Replace</button>
          <button id="clear-btn" class="btn-secondary" type="button" hidden>Remove</button>
        </div>
      </div>

      <div class="contract-body">
        <label id="drop-zone" class="drop-zone" for="file-input">
          <span class="drop-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 17v-6"/><path d="m9.5 13 2.5-2.5 2.5 2.5"/></svg>
          </span>
          <span class="drop-title">Upload your contract</span>
          <span class="drop-text">Drag and drop a PDF here, or <u>browse files</u></span>
          <span class="hint">PDF only</span>
        </label>
        <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>
        <p id="upload-error" class="error" role="alert" hidden></p>

        <div id="viewer" class="viewer" hidden>
          <iframe id="pdf-frame" title="Contract preview"></iframe>
        </div>
      </div>
    </section>

    <!-- Right: chat -->
    <section class="panel" aria-labelledby="chat-title">
      <div class="panel-header">
        <div>
          <h2 id="chat-title">Ask about this contract</h2>
          <p class="sub">Ask questions while you read the document.</p>
        </div>
      </div>

      <div id="messages" class="messages" role="log" aria-live="polite">
        <div class="message bot">Upload a contract, then ask me anything about it.</div>
      </div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <label for="chat-input" class="sr-only">Your question</label>
        <input id="chat-input" type="text" placeholder="Type your question…">
        <button type="submit" class="btn-primary">
          Send
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
